<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#070817">
<title>Admin Login | GOPI ONLINE SERVICE</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap');

:root {
  --bg: #070817;
  --text: #f5f7ff;
  --muted: #929bb5;
  --blue: #5685ff;
  --cyan: #28d8f4;
  --violet: #9a70ff;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  min-height: 100vh;
  display: grid;
  place-items: center;
  padding: 20px;
  overflow-x: hidden;
  font-family: "DM Sans", sans-serif;
  color: var(--text);
  background:
    radial-gradient(ellipse at 15% 10%, #394d9b40, transparent 40%),
    radial-gradient(ellipse at 90% 90%, #16b9d525, transparent 38%),
    var(--bg);
}

.glow {
  position: fixed;
  width: 240px;
  height: 240px;
  border-radius: 50%;
  filter: blur(90px);
  pointer-events: none;
  background: #775cff35;
  top: 5%;
  left: 5%;
}

.card {
  width: min(430px, 100%);
  position: relative;
  padding: 30px;
  border: 1px solid #ffffff16;
  border-radius: 25px;
  background: linear-gradient(145deg, #171b34e8, #0b0d1beb);
  box-shadow:
    0 25px 90px #0007,
    0 0 35px #637cff12,
    inset 0 1px 0 #ffffff12;
  animation: appear .6s ease both;
}

@keyframes appear {
  from { opacity: 0; transform: translateY(16px); }
  to { opacity: 1; transform: translateY(0); }
}

.brand {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 28px;
}

.logo {
  width: 49px;
  height: 49px;
  display: grid;
  place-items: center;
  border-radius: 15px;
  font: 800 16px Manrope, sans-serif;
  background: linear-gradient(135deg, var(--blue), var(--violet), var(--cyan));
  box-shadow: 0 0 28px #6585ff45;
}

.brand h2 {
  font: 800 15px Manrope, sans-serif;
  letter-spacing: .3px;
}

.brand p {
  color: var(--muted);
  font-size: 10px;
  margin-top: 4px;
}

.badge {
  display: inline-block;
  padding: 7px 11px;
  border: 1px solid #9a70ff40;
  border-radius: 20px;
  color: #c9b8ff;
  background: #9a70ff12;
  font-size: 10px;
  font-weight: 800;
  letter-spacing: 1px;
}

h1 {
  margin: 17px 0 9px;
  font: 800 30px/1.15 Manrope, sans-serif;
  letter-spacing: -1px;
}

.description {
  margin-bottom: 25px;
  color: var(--muted);
  font-size: 12px;
  line-height: 1.7;
}

label {
  display: block;
  margin: 17px 0 8px;
  color: #d6def2;
  font-size: 11px;
  font-weight: 700;
}

.input-wrap {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 0 12px;
  border: 1px solid #ffffff16;
  border-radius: 13px;
  background: #050713a8;
  transition: .25s;
}

.input-wrap:focus-within {
  border-color: #7194ffad;
  box-shadow: 0 0 0 3px #5685ff17, 0 0 22px #5685ff12;
}

.input-wrap span {
  color: #9ba8c8;
}

input {
  width: 100%;
  min-width: 0;
  padding: 14px 0;
  border: 0;
  outline: 0;
  color: #fff;
  background: transparent;
  font: 500 12px "DM Sans", sans-serif;
}

input::placeholder {
  color: #69738d;
}

.show-password {
  flex-shrink: 0;
  padding: 5px 0 5px 5px;
  border: 0;
  color: #a9bcff;
  background: transparent;
  cursor: pointer;
  font-size: 10px;
  font-weight: 700;
}

.login-btn {
  width: 100%;
  margin-top: 24px;
  padding: 14px;
  border: 0;
  border-radius: 13px;
  color: white;
  background: linear-gradient(100deg, #4b78ff, #8b5cf6, #20cbea);
  background-size: 200% 100%;
  box-shadow: 0 12px 30px #5678ff25;
  cursor: pointer;
  font: 800 12px Manrope, sans-serif;
  transition: .25s;
}

.login-btn:hover {
  transform: translateY(-2px);
  box-shadow: 0 15px 35px #5678ff40;
  background-position: 100% 0;
}

.login-btn:disabled {
  opacity: .65;
  cursor: wait;
  transform: none;
}

.message {
  display: none;
  margin-top: 15px;
  padding: 12px;
  border-radius: 11px;
  font-size: 11px;
  line-height: 1.6;
  overflow-wrap: anywhere;
}

.message.error {
  display: block;
  color: #ffb3bf;
  border: 1px solid #ff718530;
  background: #ff718510;
}

.message.success {
  display: block;
  color: #8af0c0;
  border: 1px solid #45e3a030;
  background: #45e3a010;
}

.back-btn {
  display: block;
  margin-top: 20px;
  padding: 12px;
  border: 1px solid #ffffff17;
  border-radius: 12px;
  color: #dce4fa;
  text-align: center;
  text-decoration: none;
  font-size: 11px;
  font-weight: 700;
  transition: .25s;
}

.back-btn:hover {
  border-color: #8b9fff80;
  background: #ffffff08;
}

.security {
  margin-top: 22px;
  color: #707b98;
  text-align: center;
  font-size: 10px;
  line-height: 1.7;
}

@media(max-width: 420px) {
  .card { padding: 23px 19px; }
  h1 { font-size: 27px; }
}
</style>
</head>

<body>
<div class="glow"></div>

<main class="card">
  <header class="brand">
    <div class="logo">GO</div>
    <div>
      <h2>GOPI ONLINE SERVICE</h2>
      <p>Secure Administration</p>
    </div>
  </header>

  <span class="badge">🛡️ PRIVATE ADMIN ACCESS</span>

  <h1>Welcome, Admin</h1>
  <p class="description">
    Sign in with your authorized administrator account
    to access the Admin Control Center.
  </p>

  <form id="adminLoginForm">
    <label for="adminEmail">Admin Email</label>
    <div class="input-wrap">
      <span>✉</span>
      <input
        id="adminEmail"
        type="email"
        placeholder="Enter admin email"
        autocomplete="username"
        required
      >
    </div>

    <label for="adminPassword">Password</label>
    <div class="input-wrap">
      <span>🔒</span>
      <input
        id="adminPassword"
        type="password"
        placeholder="Enter admin password"
        autocomplete="current-password"
        required
      >
      <button class="show-password" id="togglePassword" type="button">
        SHOW
      </button>
    </div>

    <button class="login-btn" id="loginButton" type="submit">
      SIGN IN TO ADMIN PANEL →
    </button>

    <div id="loginMessage" class="message" role="status" aria-live="polite"></div>
  </form>

  <a class="back-btn" href="dashboard.html">
    ← Back to Customer Dashboard
  </a>

  <p class="security">
    🔐 Secure Admin Access<br>
    Your account must be authorized before entering the Admin Panel.
  </p>
</main>

<script type="module">
import { supabase } from "./supabase.js";

const ADMIN_EMAIL = "gopi742301@gmail.com";

const form = document.getElementById("adminLoginForm");
const emailInput = document.getElementById("adminEmail");
const passwordInput = document.getElementById("adminPassword");
const loginButton = document.getElementById("loginButton");
const message = document.getElementById("loginMessage");

function showMessage(text, type = "error") {
  message.textContent = text;
  message.className = "message " + type;
}

document.getElementById("togglePassword").addEventListener("click", () => {
  const showing = passwordInput.type === "text";
  passwordInput.type = showing ? "password" : "text";
  document.getElementById("togglePassword").textContent =
    showing ? "SHOW" : "HIDE";
});

form.addEventListener("submit", async (event) => {
  event.preventDefault();

  const email = emailInput.value.trim().toLowerCase();
  const password = passwordInput.value;

  if (email !== ADMIN_EMAIL.toLowerCase()) {
    showMessage("This email is not authorized for Admin access.");
    return;
  }

  loginButton.disabled = true;
  loginButton.textContent = "VERIFYING LOGIN…";
  message.className = "message";

  try {
    const { data, error } = await supabase.auth.signInWithPassword({
      email,
      password
    });

    if (error) throw error;

    if (
      data.user?.email?.trim().toLowerCase() !==
      ADMIN_EMAIL.toLowerCase()
    ) {
      await supabase.auth.signOut();
      throw new Error("This account is not authorized for Admin access.");
    }

    showMessage("Login successful. Opening Admin Panel…", "success");

    window.location.replace("admin.html");
  } catch (error) {
    console.error("Admin login error:", error);

    showMessage(
      error.message ||
      "Login failed. Check your email, password, and Supabase settings."
    );

    loginButton.disabled = false;
    loginButton.textContent = "SIGN IN TO ADMIN PANEL →";
  }
});
</script>
</body>
</html>
